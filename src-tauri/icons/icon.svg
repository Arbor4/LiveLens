<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(180)">
      <stop offset="0%" stop-color="#FFCC00" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldGrad" x1="188" y1="136" x2="376" y2="324" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE047"/>
      <stop offset="50%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="48" y1="48" x2="464" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="116" fill="url(#ambientGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" stroke="url(#rimGrad)" stroke-width="2"/>

  <!-- Bottom-left L (Viewfinder Bracket) -->
  <path d="M136 188 V332 Q136 376 180 376 H324" stroke="#F8FAFC" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top-right Inverted L (Viewfinder Bracket) -->
  <path d="M188 136 H332 Q376 136 376 180 V324" stroke="url(#goldGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Live Lens Core -->
  <circle cx="256" cy="256" r="42" fill="url(#goldGrad)"/>
</svg>
